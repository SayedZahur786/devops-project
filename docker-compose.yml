services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hackboard
      POSTGRES_PASSWORD: hackboard
      POSTGRES_DB: hackboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://hackboard:hackboard@postgres:5432/hackboard
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
