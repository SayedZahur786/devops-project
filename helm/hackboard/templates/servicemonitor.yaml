{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hackboard-backend
  namespace: {{ .Values.namespace }}
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: hackboard-backend
  endpoints:
    - port: "8000"
      path: /metrics
      interval: 15s
{{- end }}
