apiVersion: v1
kind: Secret
metadata:
  name: hackboard-db
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hackboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@hackboard-postgres:5432/{{ .Values.postgres.database }}
